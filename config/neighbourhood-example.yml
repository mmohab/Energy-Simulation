# Example external configuration override.
#
# Run with:
#   java -jar target/neighbourhood-energy-sim-1.0.0.jar \
#        --spring.config.additional-location=file:./config/neighbourhood-example.yml
#
# or with Maven:
#   mvn spring-boot:run -Dspring-boot.run.arguments=--spring.config.additional-location=file:./config/neighbourhood-example.yml
#
# Only the keys listed here are overridden; anything omitted keeps the
# built-in default from src/main/resources/application.yml.

neighbourhood:
  seed: 42                     # fixed seed -> identical neighbourhood + weather every run
  stepMinutes: 5                 # finer-grained 5-minute ticks
  startDate: 2026-01-10           # a winter's day...
  startTime: 18:00                 # ...starting in the evening peak
  houseCount: 15                # a smaller street
  heatPumpProbability: 0.80      # a heavily electrified-heating street
  pvProbability: 0.70
  evChargerProbability: 0.60
  homeEvChargerPowerOptionsKw: [7.4, 11.0]
  batteryEnabled: true
  batteryCapacityKwh: 120.0
  batteryMaxChargePowerKw: 60.0
  batteryMaxDischargePowerKw: 60.0
  batteryRoundTripEfficiency: 0.90
  batteryInitialSocPercent: 80.0
  batteryPeakThresholdKw: 45.0
  publicChargerCount: 3          # auto-generates 3 named/rated chargers
  publicChargerPowerOptionsKw: [22.0, 50.0]   # only fast/rapid points on this street
